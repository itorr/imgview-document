<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{CANONICAL}}">
  {{ALTERNATES}}
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <title>{{TITLE}}</title>
</head>
<body>
  <!--HEADER-->
  <main id="main">
    <section class="hero hero-product wrap"><div class="hero-copy"><h1>{{HEADING}}</h1><p class="hero-description">{{HERO_DESCRIPTION}}</p>{{DOWNLOAD_LINKS}}</div><figure class="hero-product-image"><img src="/assets/cover.svg" width="576" height="480" alt="{{COVER_ALT}}"></figure></section><section class="intro wrap" aria-label="{{FEATURE_HEADING}}"><p class="performance"><strong>{{SPEED}}</strong><small>{{SPEED_NOTE}}</small></p><p><strong>{{FEATURE_HEADING}}</strong><br>{{FEATURE_BODY}}</p></section>
  </main>
  <!--FOOTER-->
</body>
</html>
